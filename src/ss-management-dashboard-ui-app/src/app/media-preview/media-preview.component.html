@if (data) {
  <div>
    <div class="asset-media" #mediaEle>
      @if (isVideoMedia(data.type)) {
        <video [src]="data.assetUrl" autoplay muted loop oncanplay="this.play()"
          onloadedmetadata="this.muted = true" [attr.width]="mediaWidth">
          Your device browser does not support the video tag.
        </video>
      }
      @if (!isVideoMedia(data.type)) {
        <img [src]="data.assetUrl" [attr.width]="mediaWidth"  [attr.alt]="dataAlt" />
      }
    </div>
  </div>
}

@if (!data) {
  <div>
    No media
  </div>
}
