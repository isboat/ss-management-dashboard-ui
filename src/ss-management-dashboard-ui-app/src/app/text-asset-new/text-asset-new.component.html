<div class="main-content">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header card-header-primary">
                <h3 class="card-title">Create a new AD or Information Asset</h3>
                <p class="card-category">
                    This can be used for ad, information, etc
                </p>
            </div>
            <div class="card-body">
                <div class="row mt-5">
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="formtitle" class="form-label">Title</label>
                            <input [ngModel]="title()" (ngModelChange)="title.set($event)" class="form-control" type="text" id="formtitle">
                        </div>
                    </div>
                </div>
                <div class="row mt-5">
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label for="exampleFormControlTextarea1" class="form-label">Text / Information</label>
                            <ckeditor [editor]="Editor"
                                [config]="{ toolbar: [ 'heading', '|', 'bold', 'italic', 'NumberedList','BulletedList', 'blockQuote' ] }"
                                [ngModel]="desc()" (ngModelChange)="desc.set($event)"></ckeditor>
                        </div>
                    </div>
                </div>
                <div class="row mt-5">
                    <div class="col-md-2">
                        <div class="mb-3">
                            <label for="bgColor" class="form-label">Background Color</label>
                            <input [ngModel]="backgroundColor()" (ngModelChange)="backgroundColor.set($event)" class="form-control" type="text" id="bgColor">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <div class="mb-3">
                            <label for="bgColor" class="form-label">Text Color</label>
                            <input [ngModel]="textColor()" (ngModelChange)="textColor.set($event)" class="form-control" type="text" id="bgColor">
                        </div>
                    </div>
                </div>
                <div class="row mt-5">
                    <div class="col-md-4">
                        <div class="mb-3">
                            <button (click)="postNew()" [disabled]="submitting()" type="button" class="btn btn-primary mt-3">{{submitting() ? 'Creating...' : 'Create'}}</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
