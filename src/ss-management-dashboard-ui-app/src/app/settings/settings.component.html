<div class="main-content">
  <div class="container-fluid">
    @if (allowToView()) {
      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header card-header-info">
              <h3 class="card-title">Details</h3>
              <p class="card-category">
                Below is the details
              </p>
            </div>
            @if (data(); as settings) {
              <div class="card-body">
                <mat-form-field class="example-full-width">
                  <input matInput placeholder="Name" type="text" [(ngModel)]="settings.name">
                </mat-form-field>
                <mat-form-field class="example-full-width">
                  <input matInput placeholder="Email" type="email" [(ngModel)]="settings.email">
                </mat-form-field>
                <mat-form-field class="example-full-width">
                  <input matInput placeholder="Address field" type="text" [(ngModel)]="settings.address">
                </mat-form-field>
                <mat-form-field class="example-full-width">
                  <input matInput placeholder="city" type="text" [(ngModel)]="settings.city">
                </mat-form-field>
                <mat-form-field class="example-full-width">
                  <input matInput placeholder="country" type="text" [(ngModel)]="settings.country">
                </mat-form-field>
                <mat-form-field class="example-full-width">
                  <input matInput placeholder="postcode" type="text" [(ngModel)]="settings.postcode">
                </mat-form-field>
                <mat-form-field class="example-full-width">
                  <input matInput placeholder="telephone" type="text" [(ngModel)]="settings.telephone">
                </mat-form-field>
                <p class="card-category">
                  <br /><br /><br />
                  Save changes you've made to the detail.
                </p>
                <p class="card-category">
                  <button (click)="saveUpdates()" [disabled]="saving()" class="btn btn-round btn-fill btn-info">{{saving() ? 'Saving...' : 'Save Updates'}}</button>
                </p>
              </div>
            }
          </div>
        </div>
        <div class="col-md-6">
          @if (data(); as settings) {
            <div class="card">
              <div class="card-header card-header-warning">
                <h3 class="card-title">Permissions</h3>
                <p class="card-category">
                  Click button below to allow partner permission
                </p>
              </div>
              <div class="card-body">
                <div class="form-check">
                  <input class="" type="checkbox" id="flexCheckChecked" [(ngModel)]="settings.allowedPartnerPermission">
                  <!-- <input type="checkbox" [checked]="data.allowedPartnerPermission" (change)="data.allowedPartnerPermission = !data.allowedPartnerPermission"/> -->
                  <label class="form-check-label" for="flexCheckChecked">
                    Allow permission
                  </label>
                </div>
                <div>
                  <button (click)="updatePermission()" [disabled]="updatingPermission()" class="btn btn-round btn-fill btn-warning">{{updatingPermission() ? 'Saving...' : 'Save Permission'}}</button>
                </div>
              </div>
            </div>
          }
        </div>
      </div>
    }
    @if (!allowToView()) {
      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div class="card-header card-header-danger">
              <h3 class="card-title">Forbidden</h3>
            </div>
            <div class="card-body">
              <p class="card-category">You are not allow to view this page. </p>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
