<div class="main-content collection-page"><div class="container-fluid"><div class="collection-shell"><header class="collection-hero hero-messages"><div><span class="collection-eyebrow"><i class="material-icons">text_fields</i> Message library</span><h2>Messages & information</h2><p>Build announcements, promotions and notices that are easy to read.</p></div><a routerLink="/text-asset-new" class="hero-button"><i class="material-icons">add</i>New message</a></header><div class="collection-summary"><span><b>{{listData().length}}</b> messages</span><small>Reusable across every playlist</small></div><div class="message-grid">@for(item of listData();track item.id;let index=$index){<article class="message-card" [style.--item-index]="index"><div class="quote-mark">“</div><span class="type-label">Text content</span><a [routerLink]="['/text-asset',item.id]" class="visual-title">{{item.name}}</a><div class="message-preview" [innerHTML]="item.description || 'Add your announcement or information here.'"></div><label class="modern-select-label">Add to playlist<select class="modern-select" (change)="updatePlaylist($event,item.id)"><option value="none">Choose playlist</option>@for(pl of playlists();track pl.id){<option [value]="pl.id" [selected]="playlistContainTextIds(pl,item.id)">{{pl.name}}</option>}</select></label><div class="visual-card-footer"><a [routerLink]="['/text-asset',item.id]" class="soft-action"><i class="material-icons">edit</i>Edit</a><button (click)="deleteText(item.id)" [disabled]="deletingId()===item.id" class="danger-icon"><i class="material-icons">delete_outline</i></button></div></article>}</div><div class="collection-more"><button [disabled]="loading()" (click)="fetchListData()">{{loading()?'Loading...':'Load more'}} <i class="material-icons">expand_more</i></button></div></div></div></div>
