<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header card-header-tabs card-header-primary primary-bg-color">
            <div class="nav-tabs-navigation">
              <div class="nav-tabs-wrapper">
                <span class="nav-tabs-title">TABS:</span>
                <ul class="nav nav-tabs" data-tabs="tabs">
                  <li class="nav-item">
                    <a mat-button class="nav-link active" href="#listtextasset" data-toggle="tab">
                      <i class="material-icons">perm_media</i> Text Assets
                      <div class="ripple-container"></div>
                    </a>
                  </li>
                  <!-- <li class="nav-item">
                  <a mat-button class="nav-link" href="#externalmedia" data-toggle="tab">
                    <i class="material-icons">cloud</i> External Media +
                    <div class="ripple-container"></div>
                  </a>
                </li> -->
              </ul>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="tab-content">
            <div class="tab-pane active" id="listtextasset">
              <p class="card-category"> The list of ADs or information assets</p>
              <p class="card-category">
                <a [routerLink]="['/text-asset-new']" mat-raised-button type="button"
                class="btn btn-info">New Text</a>
              </p>

              <div class="table-responsive">
                <table class="table">
                  <thead class=" text-primary">
                    <th>
                      Name
                    </th>
                    <th>
                      Select PlayList
                    </th>
                    <th>

                    </th>
                  </thead>
                  <tbody>
                    @for (item of listData(); track item.id) {
                      <tr>
                        <td>
                          <a [routerLink]="['/text-asset', item.id]">
                            {{item.name}}
                          </a>
                        </td>
                        <td>
                          <div>You can optionally add this asset to a playlist</div>
                          <div>
                            <select class="form-control"
                              (change)="updatePlaylist($event, item.id)">
                              <option value="none">Select playlist</option>
                              @for (pl of playlists(); track pl.id) {
                                <option [value]="pl.id"
                                  [selected]="playlistContainTextIds(pl, item.id)">
                                  {{pl.name}}
                                </option>
                              }
                            </select>
                          </div>
                        </td>
                        <td class="text-primary">
                          <button (click)="deleteText(item.id)" [disabled]="deletingId() === item.id" mat-raised-button type="button"
                            class="btn btn-danger">
                            {{deletingId() === item.id ? 'Deleting...' : 'Delete'}}
                          </button>
                        </td>
                      </tr>
                    }
                  </tbody>
                </table>
              </div>

              <div>
                <button class="btn btn-link load-more-link" [disabled]="loading()" (click)="fetchListData()">{{loading() ? 'Loading...' : 'Load more'}}</button>
              </div>
            </div>
            <div class="tab-pane" id="externalmedia">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
