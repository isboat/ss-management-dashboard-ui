<div class="main-content">
  <div class="container-fluid">
    @if (data(); as media) {
      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body">
              <div title="{{media.description}}">
                <media-preview [data]="media" [previewWidth]="previewWidth" [dataAlt]="media.description"></media-preview>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-body">
              <div>You can update media name</div>
              <div>
                <input [ngModel]="media.name" (ngModelChange)="setMediaName($event)" type="text" class="form-control" placeholder="Add Value"
                  [disabled]="!media.editName" style="width: 50%; display:inline-block">
                <button mat-raised-button type="button" matTooltip="Edit Name"
                  [matTooltipPosition]="'above'" (click)="enableNameEditing()" [hidden]="media.editName"
                  class="btn btn-primary btn-link btn-sm btn-just-icon">
                  <i class="material-icons">edit</i>
                </button>
                <button (click)="saveName()" mat-raised-button type="button" [hidden]="!media.editName" [disabled]="savingName()"
                  matTooltip="Click to save/update name" [matTooltipPosition]="'above'"
                  class="btn btn-outline-success btn-link btn-sm btn-just-icon">
                  <i class="material-icons">check_circle</i>
                </button>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-body">
              <div>You can optionally add this media to a playlist</div>
              <div>
                <select class="form-control" [disabled]="loadingPlaylists() || updatingPlaylist()" (change)="updatePlaylist($event, media.id)">
                  <option value="none">{{loadingPlaylists() ? 'Loading playlists...' : 'Select playlist'}}</option>
                  @for (pl of playlists(); track pl.id) {
                    <option [value]="pl.id"
                      [selected]="playlistContainMediaIds(pl, media.id)">
                      {{pl.name}}
                    </option>
                  }
                </select>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-body">
              <div>
                <button (click)="deleteMedia(media.id)" [disabled]="deleting()" mat-raised-button type="button" class="btn btn-danger">
                  {{deleting() ? 'Deleting...' : 'Delete Media'}}
                </button>
              </div>
            </div>
          </div>
          <div>
            Description: {{media.description}}
          </div>
        </div>
      </div>
    }
  </div>
</div>
