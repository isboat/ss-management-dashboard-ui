<div class="main-content">
  @if (data(); as asset) {
    <div class="container-fluid">
      <div class="card">
        <div class="card-header card-header-primary">
          <h3 class="card-title">Edit AD or Information Asset</h3>
          <p class="card-category">
            This can be used for ad, information, etc
          </p>
        </div>
        <div class="card-body">
          <div class="row mt-5">
            <div class="col-md-5">
              <div class="mb-3">
                <label for="formtitle" class="form-label">Title/Name</label>
                <input [(ngModel)]="asset.name" class="form-control" type="text" id="formtitle">
              </div>
            </div>
          </div>
          <div class="row mt-5">
            <div class="col-md-5">
              <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Text / Information</label>
                <ckeditor [editor]="Editor"
                  [config]="{ width: '400px', height: '500px', toolbar: [ 'heading', '|', 'bold', 'italic', 'NumberedList','BulletedList', 'blockQuote' ] }"
                [(ngModel)]="asset.description"></ckeditor>
              </div>
            </div>
          </div>
          <div class="row mt-5">
            <div class="col-md-2">
              <div class="mb-3">
                <label for="bgColor" class="form-label">Background Color</label>
                <input [(ngModel)]="asset.backgroundColor" class="form-control" type="text" id="bgColor">
              </div>
            </div>
            <div class="col-md-1">
            </div>
            <div class="col-md-2">
              <div class="mb-3">
                <label for="bgColor" class="form-label">Text Color</label>
                <input [(ngModel)]="asset.textColor" class="form-control" type="text" id="bgColor">
              </div>
            </div>
          </div>
          <div class="row mt-5">
            <div class="col-md-4">
              <div class="mb-3">
                <button (click)="save()" [disabled]="saving()" type="button" class="btn btn-primary mt-3">{{saving() ? 'Saving...' : 'Save'}}</button>
              </div>
            </div>
          </div>
          <div class="row mt-5">
            <div class="col-md-12">
              <div><small>Created on: {{asset.createdOn}}, Last updated on: {{asset.updatedOn}}</small></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
