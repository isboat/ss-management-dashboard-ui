@if (itemId()) {
  <br /><br />
  <a style="cursor: pointer;" (click)="viewHistory()" data-toggle="modal" data-target="#historyModal">
    View Historical Changes
  </a>
  <!-- Modal -->
  <div class="modal fade" id="historyModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog" role="document" style="max-width: 50%">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Historical Changes</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        @if (histories().length) {
          <div class="modal-body">
            <div class="table-responsive">
              <table class="table table-hover">
                <thead class="text-warning">
                  <th>Date</th>
                  <th>User</th>
                  <th>History</th>
                </thead>
                <tbody>
                  @for (item of histories(); track item.createdOn) {
                    <tr>
                      <td>{{toDate(item.createdOn) | date:'medium'}}</td>
                      <td>{{item.user}}</td>
                      <td>{{item.log}}</td>
                    </tr>
                  }
                </tbody>
              </table>
            </div>
          </div>
        }
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-info">Load More</button>
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
}

@if (!itemId()) {
  <div>
    No data
  </div>
}
