name: Application CI and Azure deployment

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ss-management-dashboard-ui-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/ss-management-dashboard-ui-app/.nvmrc
          cache: npm
          cache-dependency-path: src/ss-management-dashboard-ui-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false --browsers=ChromeHeadless --progress=false
      - run: npm run build -- --progress=false
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Deploy to Azure Static Web Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/ss-management-dashboard-ui-app/dist/browser
          output_location: ''
          skip_app_build: true
